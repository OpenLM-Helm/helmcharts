# Control plane, one infrastructure node (ingress, databases, monitoring, storage)
# and application workers, plus a separate load balancer.
# Set haproxy_ingress_nodes: ["k8s-i-1"] and, with Longhorn, longhorn_storage_nodes: ["k8s-i-1"].

[masters]
k8s-m-1 ansible_host=192.0.2.10

[workers]
k8s-i-1 ansible_host=192.0.2.11 node_label=infrastructure node_taint=infrastructure
k8s-w-1 ansible_host=192.0.2.21 node_label=main node_taint=main
k8s-w-2 ansible_host=192.0.2.22 node_label=main node_taint=main

[lb]
k8s-lb ansible_host=192.0.2.5

[all:vars]
ansible_user=ubuntu
