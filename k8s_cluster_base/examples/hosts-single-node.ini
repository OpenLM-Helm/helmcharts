# One machine runs the control plane AND the workloads, plus a separate load balancer.
# Listing the master in [workers] too is what lets workloads run on it.
# Add workers later (see README, "Scaling out").

[masters]
k8s-m-1 ansible_host=192.0.2.10 node_label=main node_taint=main

[workers]
k8s-m-1

[lb]
k8s-lb ansible_host=192.0.2.5

[all:vars]
ansible_user=ubuntu
