# Dedicated control plane + workers, plus a separate load balancer.
# The master is not in [workers], so it keeps the control-plane taint and runs no workloads.

[masters]
k8s-m-1 ansible_host=192.0.2.10

[workers]
k8s-w-1 ansible_host=192.0.2.21 node_label=main node_taint=main
k8s-w-2 ansible_host=192.0.2.22 node_label=main node_taint=main
k8s-w-3 ansible_host=192.0.2.23 node_label=main node_taint=main

[lb]
k8s-lb ansible_host=192.0.2.5

[all:vars]
ansible_user=ubuntu
